name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Security: Principle of least privilege.
# Grant only read access to the repository contents for the CI token.
permissions:
  contents: read

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache: true 

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run unit and integration tests
      shell: bash
      # Added timeout to prevent hung tests from burning CI minutes
      run: go test -v -race -timeout=10m -coverprofile=coverage.out ./...

    - name: Run E2E Tests (Windows)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: ./scripts/e2e_test.ps1

    - name: Run E2E Tests (Linux/macOS)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        chmod +x ./scripts/e2e_test.sh
        ./scripts/e2e_test.sh

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.out
        fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache: false 

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --timeout=5m

  security:
      name: Security Scan
      runs-on: ubuntu-latest
      steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true 

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master 
        with:
          args: '-fmt sarif -out results.sarif ./...'

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  benchmark:
    name: Memory Allocation Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
    - name: Run Benchmarks (Check Zero-Allocations)
      run: go test -bench . -benchmem ./internal/crypto/... ./internal/memory/...

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Build Binary
      run: |
        make build-static
        ./build/hako --help

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: hako-linux-amd64
        path: build/hako
        retention-days: 7