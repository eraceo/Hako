version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly" 
      day: "monday"      
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5 
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore" 
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    labels:
      - "dependencies"
      - "actions"
    commit-message:
      prefix: "chore"
    groups:
      actions-dependencies:
        patterns:
          - "*"